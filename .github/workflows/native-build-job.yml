# Reusable workflow for building the native shim for both regular builds and version publish
name: Build Executorch Native Shim

on:
  workflow_call:
    outputs:
      artifact-pattern:
        description: "Pattern matching the artifact name for the built shim"
        value: executorch-libs-*

jobs:
  build-executorch-shim:
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout djl-executorch-engine repository
        uses: actions/checkout@v7

      # Provenance gate: prove the pinned runtime tarball was built by Repo A's CI before we link
      # against it. URL_HASH in native/CMakeLists.txt covers integrity; this covers provenance.
      - name: Verify ExecuTorch runtime provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(grep -oE 'https://[^"]*logging-${{ matrix.platform }}\.tar\.gz' native/cmake/EtRuntimePin.cmake | head -1)"
          test -n "${url}" || { echo "no logging URL in EtRuntimePin.cmake"; exit 1; }
          curl -fL -o runtime.tgz "${url}"
          gh attestation verify runtime.tgz --repo measly-java-learning/executorch-runtime-dist
          rm -f runtime.tgz

      # The shared toolchain image, published by measly-java-learning/base-docker-images. It is a
      # public manifest list covering amd64 and arm64, so both matrix rows use one reference and the
      # pull needs no credentials. The digest is read from .engine-build-image rather than written
      # here, so a bump is one line that this workflow and native/local_build_wrapper.sh both pick up.
      - name: Resolve the pinned build image
        run: |
          image="$(cat .engine-build-image)"
          test -n "${image}" || { echo "empty .engine-build-image" >&2; exit 1; }
          echo "ET_BUILD_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "Build image: ${image}"

      # Runs the same pinned image as native/local_build_wrapper.sh, so CI matches local builds.
      - name: Build the libexecutorch_djl shim
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.ET_BUILD_IMAGE }} \
            /bin/bash /workspace/native/build.sh
      
      - name: QA the libexecutorch_djl shim
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.ET_BUILD_IMAGE }} \
            /bin/bash /workspace/native/build_qa.sh

      # OpenVINO tests run HERE, in the job that staged the bundle, not in build-java-package:
      # native/build.sh stages both the shim and the OpenVINO bundle into
      # src/main/resources/native/<platform>/, while build-java-package's *.so download glob does
      # not match *.so.2541, so the bundle never reaches that job and openvinoTest would skip
      # there. This row is the only place the bundle exists for real.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: OpenVINO delegate tests
        if: matrix.platform == 'linux-x86_64'
        run: ./gradlew openvinoTest

      # The three shell tests assert against build/native-staging/<platform>/, but build.sh stages
      # into src/main/resources/native/<platform>/ -- sync first, or openvino_bundle_staging.sh
      # would SKIP and openvino_version_coupling.sh's staged-bundle branch would be dead. The
      # runtime tarball (native/build/_deps/...) persists from the container build steps above,
      # which is what openvino_linkage.sh checks against.
      # The rule deciding which runtime variant each platform ships. Host-fast and platform-
      # independent: variant_select.sh takes the platform identity as an input, so it asserts the
      # Windows and aarch64 rules from this runner too.
      - name: Variant selection tests
        run: |
          ./native/tests/variant_select.sh
          ./native/tests/build_config.sh

      - name: OpenVINO shell tests (linkage, staging, version coupling, loader flags)
        if: matrix.platform == 'linux-x86_64'
        run: |
          mkdir -p build/native-staging/linux-x86_64
          cp -r src/main/resources/native/linux-x86_64/. build/native-staging/linux-x86_64/
          ./native/tests/openvino_pin_selector.sh
          # Source-only, so it guards the WINDOWS loader shape from the cheapest job in the matrix.
          # The behavioural gate (OpenVinoColdProbeTest) needs a staged bundle and a Windows host.
          ./native/tests/openvino_loader_flags.sh
          ./native/tests/openvino_linkage.sh
          ./native/tests/openvino_bundle_staging.sh
          ./native/tests/openvino_version_coupling.sh
          ./native/tests/notices_staged.sh

      # The inverse leg: linux-aarch64 ships no OpenVINO delegate, so assert that a .pte needing
      # one produces OUR platform error rather than the generic corrupt-model message.
      - name: OpenVINO unsupported-platform error
        if: matrix.platform == 'linux-aarch64'
        run: ./gradlew openvinoUnsupportedTest
 
      # Gate B build phase. Runs only here: the JVM phase needs a JDK 17 the image does not have, so
      # it lives in a separate job that downloads this artifact.
      - name: Build the UBSan-instrumented shim
        if: matrix.platform == 'linux-x86_64'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.ET_BUILD_IMAGE }} \
            /bin/bash /workspace/native/ubsan_gate.sh

      # NOT executorch-libs-*: native-build.yml downloads that pattern with merge-multiple into
      # src/main/resources/native/, which would make this instrumented library what every ordinary
      # test run loads.
      - name: Store the UBSan-instrumented shim
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: executorch-ubsan-linux-x86_64
          path: ${{ github.workspace }}/native/ubsan/libexecutorch_djl.so
          compression-level: 1

      # Make the shim available to the next job
      # If we care about permissions will need to interpose a `tar` step prior to upload
      # https://github.com/actions/upload-artifact#using-outputs
      - name: Store libexecutorch_djl shim
        id: shim-upload-step
        uses: actions/upload-artifact@v7
        with:
          name: executorch-libs-${{ matrix.platform }}
          # Everything build.sh staged, rather than an enumeration of extensions. The OpenVINO
          # bundle is mostly VERSIONED sonames (libopenvino.so.2541, libtbb.so.12, libhwloc.so.15)
          # plus MANIFEST and BUILDINFO, and a *.so glob matches none of them. That gap reached the
          # publish job, where it produced an OpenVINO jar holding one of seven libraries and no
          # MANIFEST -- and it built clean, because the jar's own guard only checked for licenses.
          # This directory contains nothing but staged artifacts, so uploading it whole is both
          # simpler and immune to the next file that does not look like a library.
          path: ${{ github.workspace }}/src/main/resources/native/**
          compression-level: 1 # May want to consider no compression

  # Windows amd64: a sibling job rather than a matrix row, because the linux rows are container-based
  # (manylinux bakes the glibc floor into the image) and Windows has no container. Both jobs upload
  # under the executorch-libs-* pattern, so publish.yml and native-build.yml consume them unchanged.
  # A future macOS platform would follow this same shape. Mirrors executorch-runtime-dist's release.yml.
  build-executorch-shim-windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout djl-executorch-engine repository
        uses: actions/checkout@v7

      # Provenance gate: prove the pinned runtime tarball was built by Repo A's CI before we link
      # against it. URL_HASH in native/CMakeLists.txt covers integrity; this covers provenance.
      - name: Verify ExecuTorch runtime provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # -static: the /MT row, which is what native/CMakeLists.txt resolves via ET_RUNTIME_ROW. The
          # /MD row is still in the pin file, so a pattern without the suffix would match it and attest
          # a tarball this build never links.
          url="$(grep -oE 'https://[^"]*logging-windows-x86_64-static\.tar\.gz' native/cmake/EtRuntimePin.cmake | head -1)"
          test -n "${url}" || { echo "no logging URL in EtRuntimePin.cmake"; exit 1; }
          curl -fL -o runtime.tgz "${url}"
          gh attestation verify runtime.tgz --repo measly-java-learning/executorch-runtime-dist
          rm -f runtime.tgz

      # Resolve the VS install ONCE and publish it to $GITHUB_ENV for the steps below. Discovery is
      # edition-agnostic (-products *) rather than hardcoding Enterprise, so a runner-image edition
      # change does not silently break the build. Doing it here also means an image without VS fails
      # on a step that says so, instead of three steps repeating the same lookup.
      #
      # Only DISCOVERY is hoisted, not ACTIVATION: Launch-VsDevShell mutates the current process env,
      # and each step runs in a fresh process, so every step that needs `cl` must still activate.
      - name: Discover Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          # Add-Content, NOT `Out-File -Encoding utf8`: under Windows PowerShell 5.1 that writes a
          # UTF-8 BOM, and a BOM in GITHUB_ENV makes the runner parse the name as "<BOM>VS_PATH", so
          # $env:VS_PATH comes back empty in every later step. pwsh 7 defaults to BOM-less UTF-8 so
          # the declared `shell: pwsh` would be fine today, but Add-Content is BOM-free under both and
          # does not silently depend on which shell this step happens to run under. Verified BOM-free
          # on 5.1; `Out-File -Encoding utf8` was verified to emit a BOM there.
          Add-Content -Path $env:GITHUB_ENV -Value "VS_PATH=$vsPath"
          echo "Visual Studio: $vsPath"

      - name: Build the executorch_djl shim (MSVC)
        shell: pwsh
        run: |
          if (-not $env:VS_PATH) { throw "VS_PATH unset — the 'Discover Visual Studio' step must run first" }
          # Launch-VsDevShell mutates THIS process's env in place; the bash child inherits it.
          & "$env:VS_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation
          # The windows-2022 image ships JDK 8 as JAVA_HOME_8_X64 (8.0.492+9). Bind it EXPLICITLY rather
          # than trusting the image's default JAVA_HOME: the default is an image property GitHub can change,
          # and we want the oldest supported jni.h for the widest runtime compatibility — matching the linux
          # arm's Corretto 8 RPM. We compile against jni.h only and never link libjvm.
          if (-not $env:JAVA_HOME_8_X64) { throw "JAVA_HOME_8_X64 not set on this runner image" }
          $env:JAVA_HOME = $env:JAVA_HOME_8_X64
          # Invoke Git-Bash by explicit path so PATH order cannot select WSL's System32\bash.exe, which
          # would run the build in a Linux environment with no MSVC toolchain. Non-login (`-c`, not
          # `-lc`): a login shell re-sources the profile and resets PATH, dropping the VS env.
          $bash = "${env:ProgramFiles}\Git\bin\bash.exe"
          & $bash -c './native/build.sh'
          if ($LASTEXITCODE -ne 0) { throw "shim build failed (exit $LASTEXITCODE)" }

      - name: QA the executorch_djl shim (MSVC)
        shell: pwsh
        run: |
          if (-not $env:VS_PATH) { throw "VS_PATH unset — the 'Discover Visual Studio' step must run first" }
          & "$env:VS_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation
          $bash = "${env:ProgramFiles}\Git\bin\bash.exe"
          & $bash -c './native/build_qa.sh'
          if ($LASTEXITCODE -ne 0) { throw "shim QA failed (exit $LASTEXITCODE)" }

      # Stands in for the clean-image redist test, which we have no machine to run: asserts the CRT
      # directives across the shim tree and that the DLL imports no VCRUNTIME/MSVCP. Runs before the
      # upload so a dynamically-linked DLL is never published as an artifact.
      - name: Assert the shim links the static CRT (MSVC)
        shell: pwsh
        run: |
          if (-not $env:VS_PATH) { throw "VS_PATH unset — the 'Discover Visual Studio' step must run first" }
          & "$env:VS_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation
          $bash = "${env:ProgramFiles}\Git\bin\bash.exe"
          & $bash -c './native/tests/check_windows_crt.sh native/build src/main/resources/native/windows-x86_64/executorch_djl.dll'
          if ($LASTEXITCODE -ne 0) { throw "windows CRT check failed (exit $LASTEXITCODE)" }
      # The build steps above bind JDK 8 deliberately, for the oldest supported jni.h. Gradle 9.6.1
      # cannot run on 8, so the test steps get their own toolchain -- the same split the Linux rows
      # use, where the container build runs under the image's Corretto 8 and Gradle runs after.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Runs HERE, in the job that staged the bundle, for the same reason the Linux row does:
      # build-java-package's download glob does not match the bundle's library filenames, so the
      # bundle never reaches it and openvinoTest would silently skip there.
      - name: OpenVINO delegate tests
        shell: pwsh
        run: |
          .\gradlew.bat openvinoTest
          if ($LASTEXITCODE -ne 0) { throw "openvinoTest failed (exit $LASTEXITCODE)" }

      # windows-x86_64 ships a devtools runtime, so the profiling path must be gated here rather
      # than on a hand-run winbox session. This row runs no other JVM tests (issue #58), so without
      # this step ProfilingIT's devtools-PRESENT arm would execute on no CI runner at all: the
      # Linux rows cannot cover the Windows loader, the MSVC CRT, or flatcc's _aligned_malloc.
      # A wrong deallocator surfaces here as a JVM crash mid-test, not as a failed assertion.
      - name: Profiling tests
        shell: pwsh
        run: |
          .\gradlew.bat test --tests 'org.measly.executorch.ProfilingIT'
          if ($LASTEXITCODE -ne 0) { throw "ProfilingIT failed (exit $LASTEXITCODE)" }

      # The staging sync is done in PowerShell rather than inside bash: a `bash -c` string chaining
      # commands with && does not survive the PowerShell->native-exe quoting, so each Git-Bash call
      # below is one simple command with plain arguments -- the same shape as the CRT check above.
      - name: OpenVINO shell tests (staging, version coupling)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\native-staging\windows-x86_64 | Out-Null
          Copy-Item -Recurse -Force src\main\resources\native\windows-x86_64\* build\native-staging\windows-x86_64\
          $bash = "${env:ProgramFiles}\Git\bin\bash.exe"
          & $bash -c './native/tests/openvino_bundle_staging.sh windows-x86_64'
          if ($LASTEXITCODE -ne 0) { throw "openvino_bundle_staging failed (exit $LASTEXITCODE)" }
          & $bash -c './native/tests/openvino_version_coupling.sh windows-x86_64'
          if ($LASTEXITCODE -ne 0) { throw "openvino_version_coupling failed (exit $LASTEXITCODE)" }

      - name: Store executorch_djl shim
        uses: actions/upload-artifact@v7
        with:
          name: executorch-libs-windows-x86_64
          # Whole staged tree, matching the Linux rows: the shim, its licences, and the OpenVINO
          # bundle that build.sh stages here.
          path: ${{ github.workspace }}/src/main/resources/native/**
          compression-level: 1
