version: 2
updates:

  # Check for updates to GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Check for updates to Gradle dependencies and plugins. Versions are centralised in
  # gradle/libs.versions.toml, which also covers the :example subproject. Minor and patch updates
  # are grouped into one PR; majors arrive one per PR so a breaking change is never buried in a
  # batch. ai.djl:api and ai.djl.pytorch:pytorch-engine share the `djl` version, so they move
  # together. The engine publishes no dependency on DJL (compileOnly), so these PRs change what it
  # is built and tested against, not what consumers resolve.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      gradle-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
